{% extends "base.html" %}
{% block title %}Passwort geändert{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0 fw-bold">✅ Passwort erfolgreich geändert</h5>
      </div>
      <div class="card-body p-4 text-center">
        <p class="text-muted">Dein Passwort wurde erfolgreich zurückgesetzt.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-2">Jetzt anmelden</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
