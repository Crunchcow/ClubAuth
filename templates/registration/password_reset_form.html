{% extends "base.html" %}
{% block title %}Passwort vergessen{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0 fw-bold">Passwort zurücksetzen</h5>
      </div>
      <div class="card-body p-4">
        <p class="text-muted small mb-3">
          Gib deine E-Mail-Adresse ein. Du erhältst einen Link zum Zurücksetzen deines Passworts.
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label small fw-semibold">E-Mail-Adresse</label>
            <input type="email" name="email" class="form-control" required autofocus
                   placeholder="deine@email.de">
          </div>
          <button type="submit" class="btn btn-primary w-100">Reset-Link senden</button>
        </form>
        <a href="{% url 'login' %}" class="d-block text-center text-muted small mt-3">Zurück zur Anmeldung</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
