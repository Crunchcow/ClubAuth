<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClubAuth{% endblock %} — FCTM</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <style>
    :root {
      --fctm-red:  #c00000;
      --fctm-dark: #8b0000;
    }
    body          { background: #f4f4f4; }
    .navbar       { background-color: var(--fctm-red) !important; }
    .btn-primary  { background-color: var(--fctm-red); border-color: var(--fctm-dark); }
    .btn-primary:hover,
    .btn-primary:focus { background-color: var(--fctm-dark); border-color: var(--fctm-dark); }
    .card         { border: none; }
    .card-header  { border-bottom: 3px solid var(--fctm-red); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-dark mb-4 shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">⚽ FCTM ClubAuth</a>
    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-3">
      <span class="text-white small">{{ user.display_name }}</span>
      <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Abmelden</a>
    </div>
    {% endif %}
  </div>
</nav>

<main class="container pb-5">
  {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }} alert-dismissible fade show mb-3" role="alert">
      {{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Schließen"></button>
    </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQeqPcYEPkFMjEBWU96jBDgkRxO"
        crossorigin="anonymous"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
